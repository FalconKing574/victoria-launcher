# electron-builder.yml
appId: com.victoriakingdom.launcher
productName: Victoria Kingdom
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # An executable with no publisher, description or version block is a large
  # part of what heuristic antivirus scoring reacts to. It does not replace a
  # signature, but it removes the "completely anonymous binary" signal.
  publisherName: Victoria Kingdom
  legalTrademarks: Victoria Kingdom
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Victoria Kingdom
# Where the launcher looks for its own updates. Change owner/repo to yours.
# `npm run dist` writes latest.yml next to the installer; upload BOTH to the
# GitHub release or auto-update cannot see the new version.
publish:
  provider: github
  owner: FalconKing574
  repo: victoria-launcher
